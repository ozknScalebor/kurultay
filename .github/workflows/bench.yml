name: bench

# Kurultay vs Qwen Code on the comparison tasks (samples/evals, K1–K3 in Java and C++), with free
# online models, scored with the same hidden tests. Runs after every release (called from ci.yml)
# and by hand. Needs the repository secrets GROQ_API_KEY and (optional) GEMINI_API_KEY.
on:
  workflow_dispatch:
    inputs:
      tasks:
        description: 'task ids (comma separated, empty = all K tasks)'
        required: false
        default: ''
  workflow_call:
    inputs:
      name:
        type: string
        required: false
        default: ''
    secrets:
      GROQ_API_KEY:
        required: false
      GEMINI_API_KEY:
        required: false

concurrency:
  group: bench
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      KURULTAY_HOME: ${{ github.workspace }}/.bench-home
      NO_COLOR: '1'
    steps:
      - name: API keys
        id: keys
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::notice::GROQ_API_KEY is not set (Settings → Secrets and variables → Actions) – bench skipped"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.keys.outputs.skip != '1'
      - uses: actions/setup-node@v5
        if: steps.keys.outputs.skip != '1'
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        if: steps.keys.outputs.skip != '1'
        with: { distribution: temurin, java-version: '17' }
      - name: Build Kurultay, install Qwen Code
        if: steps.keys.outputs.skip != '1'
        run: |
          npm ci && npm run build
          npm install -g @qwen-code/qwen-code@latest
          qwen --version || true
      - name: Models
        if: steps.keys.outputs.skip != '1'
        id: models
        run: node scripts/bench-config.mjs > "$GITHUB_OUTPUT"
      - name: Capability probe (quick)
        if: steps.keys.outputs.skip != '1'
        run: node bin/kurultay.js probe --quick || echo "::warning::probe failed – defaults are used"
      - name: Bench
        if: steps.keys.outputs.skip != '1'
        env:
          # Qwen Code: OpenAI-compatible provider from the environment (docs/users/configuration/auth.md)
          OPENAI_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_BASE_URL: https://api.groq.com/openai/v1
          OPENAI_MODEL: openai/gpt-oss-120b
        run: |
          name="${{ inputs.name }}"; [ -n "$name" ] || name="manual-$(date -u +%Y%m%d-%H%M)"
          echo "BENCH_NAME=$name" >> "$GITHUB_ENV"
          node scripts/bench.mjs --out bench-out --config "$KURULTAY_HOME/config.json" --qwen qwen --minutes 30 \
            --name "$name" --models "${{ steps.models.outputs.label }}" ${{ inputs.tasks && format('--tasks {0}', inputs.tasks) || '' }}
          cat bench-out/BENCH.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the logs
        if: always() && steps.keys.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: bench-out
          path: bench-out/
          if-no-files-found: ignore
      - name: Commit the results and add them to the latest release
        if: steps.keys.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p benchmarks/bench
          cp bench-out/bench.json "benchmarks/bench/$BENCH_NAME.json"
          cp bench-out/BENCH.md "benchmarks/bench/$BENCH_NAME.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/bench
          git commit -m "chore(bench): results for $BENCH_NAME" && git pull --rebase --quiet && git push || true
          tag=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' || true)
          [ -n "$tag" ] || exit 0
          gh release view "$tag" --json body --jq .body > notes.md
          node -e "import('./scripts/swebench-summary.mjs').then(m=>{const fs=require('fs');fs.writeFileSync('notes.md',m.mergeNotes(fs.readFileSync('notes.md','utf8'),'bench',fs.readFileSync('bench-out/BENCH.md','utf8')))})"
          gh release edit "$tag" --notes-file notes.md || echo "::warning::could not update the release notes"
