name: bench

# Kurultay vs Qwen Code on the comparison tasks (samples/evals, K1–K3 in Java and C++), with free
# online models, scored with the same hidden tests. Runs after every release (called from ci.yml)
# and by hand. Repository secret: NVIDIA_API_KEY (40 requests/min, no daily token cap – two main
# models from different families + a helper, see scripts/bench-config.mjs); MISTRAL_API_KEY and
# GROQ_API_KEY are optional fallbacks.
on:
  workflow_dispatch:
    inputs:
      quick:
        description: 'quick check (~20 min): one small C++ and one small Java task, 5 minutes per agent'
        type: boolean
        required: false
        default: false
      fault:
        description: 'fault test: the main model stops answering (hang) or answers 503 (error) after a few requests'
        type: choice
        options: [none, hang, error]
        default: none
      fault_after:
        description: 'fault test: requests of the main model that still work in each run'
        required: false
        default: '3'
      repeat:
        description: 'run every task this many times (pass rate instead of one draw)'
        required: false
        default: '1'
      agents:
        description: 'agents to run (comma separated: kurultay,qwen; solo = the main model alone, only useful with mode multi)'
        required: false
        default: 'kurultay,qwen'
      tasks:
        description: 'task ids (comma separated, empty = all K tasks)'
        required: false
        default: ''
      minutes:
        description: 'wall-clock budget per agent and task (the same for every agent)'
        required: false
        default: '20'
      model:
        description: 'main model id – the GLM model with a Z.AI key, otherwise on NVIDIA NIM (empty = first answering)'
        required: false
        default: ''
      second:
        description: 'second model id on NVIDIA NIM (empty = first answering model of another family)'
        required: false
        default: ''
  workflow_call:
    inputs:
      name:
        type: string
        required: false
        default: ''
    secrets:
      NVIDIA_API_KEY:
        required: false
      MISTRAL_API_KEY:
        required: false
      GROQ_API_KEY:
        required: false
      ZAI_API_KEY:
        required: false

concurrency:
  group: bench
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      # the user's own Z.AI GLM key (main model when set); ZAI_BASE_URL as a repository variable for the Coding Plan
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      ZAI_BASE_URL: ${{ vars.ZAI_BASE_URL }}
      KURULTAY_HOME: ${{ github.workspace }}/.bench-home
      NO_COLOR: '1'
    steps:
      - name: API keys
        id: keys
        run: |
          if [ -z "$NVIDIA_API_KEY$MISTRAL_API_KEY$GROQ_API_KEY$ZAI_API_KEY" ]; then
            echo "::notice::no model API key set (NVIDIA_API_KEY in Settings → Secrets and variables → Actions) – bench skipped"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.keys.outputs.skip != '1'
      - uses: actions/setup-node@v5
        if: steps.keys.outputs.skip != '1'
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        if: steps.keys.outputs.skip != '1'
        with: { distribution: temurin, java-version: '17' }
      - name: Build Kurultay, install Qwen Code
        if: steps.keys.outputs.skip != '1'
        run: |
          npm ci && npm run build
          npm install -g @qwen-code/qwen-code@latest
          qwen --version || true
      - name: Models
        if: steps.keys.outputs.skip != '1'
        id: models
        env:
          BENCH_MODEL: ${{ inputs.model }}
          BENCH_SECOND: ${{ inputs.second }}
          # fault test: the backup must be as fast as the main model – a second GLM model on the Z.AI key
          BENCH_SECOND_PROVIDER: ${{ inputs.fault && inputs.fault != 'none' && 'zai' || '' }}
        run: node scripts/bench-config.mjs > "$GITHUB_OUTPUT"
      - name: Capability probe (minimal)
        if: steps.keys.outputs.skip != '1'
        # 4 requests per model (reachability, speed, tools, JSON); the window comes from the model family
        run: node bin/kurultay.js probe --minimal || echo "::warning::probe failed – defaults are used"
      - name: Bench
        if: steps.keys.outputs.skip != '1'
        env:
          # Qwen Code: OpenAI-compatible provider from the environment (docs/users/configuration/auth.md)
          OPENAI_BASE_URL: ${{ steps.models.outputs.qwen_base }}
          OPENAI_MODEL: ${{ steps.models.outputs.qwen_model }}
          QWEN_KEY_ENV: ${{ steps.models.outputs.qwen_key_env }}
        run: |
          export OPENAI_API_KEY="${!QWEN_KEY_ENV}"
          name="${{ inputs.name }}"; [ -n "$name" ] || name="manual-$(date -u +%Y%m%d-%H%M)"
          echo "BENCH_NAME=$name" >> "$GITHUB_ENV"
          node scripts/bench.mjs --out bench-out --config "$KURULTAY_HOME/config.json" --solo-config "${{ steps.models.outputs.solo_config }}" \
            --qwen qwen --minutes ${{ inputs.quick && 5 || inputs.minutes || 20 }} --stop-after 300 --repeat ${{ inputs.repeat || 1 }} --agents ${{ inputs.agents || 'kurultay,qwen' }} \
            ${{ inputs.fault && inputs.fault != 'none' && format('--fault {0} --fault-after {1}', inputs.fault, inputs.fault_after || '3') || '' }} \
            --name "$name" --models "${{ steps.models.outputs.label }}" ${{ inputs.quick && '--tasks C2-crc,B3-son-stok' || inputs.tasks && format('--tasks {0}', inputs.tasks) || '' }}
          cat bench-out/BENCH.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the logs
        if: always() && steps.keys.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: bench-out
          path: bench-out/
          if-no-files-found: ignore
          # failed work copies keep their .kurultay session (events.jsonl, REPORT.md)
          include-hidden-files: true
      - name: Commit the results and add Kurultay's score to the latest release
        if: steps.keys.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p benchmarks/bench
          cp bench-out/bench.json "benchmarks/bench/$BENCH_NAME.json"
          cp bench-out/BENCH.md "benchmarks/bench/$BENCH_NAME.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/bench
          git commit -m "chore(bench): results for $BENCH_NAME" && git pull --rebase --quiet && git push || true
          tag=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' || true)
          [ -n "$tag" ] || exit 0
          # only a run of the released code (named after its tag) scores that release
          [ "$BENCH_NAME" = "$tag" ] || exit 0
          [ -s bench-out/EVALUATION.md ] || exit 0
          gh release view "$tag" --json body --jq .body > notes.md
          node -e "import('./scripts/swebench-summary.mjs').then(m=>{const fs=require('fs');fs.writeFileSync('notes.md',m.mergeNotes(fs.readFileSync('notes.md','utf8'),'bench',fs.readFileSync('bench-out/EVALUATION.md','utf8')))})"
          gh release edit "$tag" --notes-file notes.md || echo "::warning::could not update the release notes"
